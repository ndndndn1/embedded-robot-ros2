name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and verification dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Run C++20 core, benchmark, and sanitizers
        run: ./tools/run_cpp_checks.sh
      - name: Run lint and strict type checks
        run: |
          ruff check .
          mypy
      - name: Verify enterprise scorecard
        run: |
          python quality/check_score.py
          robot-quality-check
      - name: Run bounded benchmark and memory soak
        run: |
          python bench/benchmark.py --iterations 1000
          python bench/soak.py --iterations 5000 --max-growth-kib 12000
      - name: Build hardened runtime image
        run: docker build --target runtime -t embedded-robot-ros2:ci .
      - name: Build and exercise ROS 2 Jazzy perception graph
        run: docker build --target ros2-test -f Dockerfile.ros2 -t embedded-robot-perception:test .

  publish-image:
    name: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build and publish runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
