[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embedded-robot-ros2"
version = "0.1.0"
description = "Mock-first ROS 2 Jazzy edge adapter for a vendor-neutral physical robot contract"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
ros2 = []

[project.scripts]
embedded-robot-ros2 = "embedded_robot_ros2.app:run"
robot-quality-check = "embedded_robot_ros2.quality:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embedded_robot_ros2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["embedded_robot_ros2"]

