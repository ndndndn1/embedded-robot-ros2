services:
  adapter:
    build:
      context: .
      target: runtime
    image: embedded-robot-ros2:local
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  test:
    profiles:
      - test
    build:
      context: .
      target: test
    image: embedded-robot-ros2:test
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
    network_mode: none
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"

